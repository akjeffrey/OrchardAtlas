name: Android phone trial
on:
  push:
    branches: [feature/v1-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build signed debug APK with local trial data
        run: flutter build apk --debug --no-pub --dart-define=TRIAL_MODE=true
      - name: Prepare phone download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/OrchardAtlas-trial.apk
          cd dist
          sha256sum OrchardAtlas-trial.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OrchardAtlas-Android-trial
          path: dist/
          retention-days: 14
