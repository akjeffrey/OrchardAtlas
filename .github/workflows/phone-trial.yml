name: Android phone trial
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore stable trial signing identity
        env:
          TRIAL_KEYSTORE: ${{ secrets.ANDROID_TRIAL_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, binascii, os, pathlib, subprocess
          encoded = ''.join(os.environ.get('TRIAL_KEYSTORE', '').strip().lstrip('\ufeff').split())
          if not encoded:
              print('::warning::Set ANDROID_TRIAL_DEBUG_KEYSTORE_BASE64 to publish an update-safe APK. This run compiles only; no temporary-key APK will be published.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TRIAL_SIGNING_READY=' + ('true' if encoded else 'false') + '\n')
          if encoded:
              target = pathlib.Path.home() / '.android' / 'debug.keystore'
              target.parent.mkdir(parents=True, exist_ok=True)
              try:
                  decoded = base64.b64decode(encoded + '=' * (-len(encoded) % 4), validate=True)
              except (binascii.Error, ValueError):
                  raise SystemExit('Signing secret is not valid Base64. Paste the full contents of orchardatlas.signing-secret.txt, without quotes or filenames.') from None
              target.touch(mode=0o600, exist_ok=True)
              target.chmod(0o600)
              target.write_bytes(decoded)
              verified = subprocess.run(
                  ['keytool', '-list', '-keystore', str(target), '-storepass', 'android', '-alias', 'androiddebugkey'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if verified.returncode != 0:
                  target.unlink(missing_ok=True)
                  raise SystemExit('Decoded signing secret is not a valid trial keystore with the expected alias and password. Use the complete generated signing-secret.txt file.')
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('ORCHARD_TRIAL_KEYSTORE=' + str(target) + '\n')
          PY
      - name: Build signed debug APK with local trial data
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo 'Missing repository Actions secret GOOGLE_MAPS_ANDROID_KEY.'
            exit 1
          fi
          flutter build apk --debug --no-pub --dart-define=TRIAL_MODE=true --build-name="0.${{ github.run_number }}.0" --build-number="${{ github.run_number }}"
      - name: Verify actual APK identity and prepare phone download
        if: env.TRIAL_SIGNING_READY == 'true'
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_trial_apk.py'
          python3 scripts/verify-trial-apk.py \
            --apk build/app/outputs/flutter-apk/app-debug.apk \
            --keystore "$ORCHARD_TRIAL_KEYSTORE" \
            --build-tools "$ANDROID_HOME/build-tools" \
            --version-name "0.${{ github.run_number }}.0" \
            --version-code "${{ github.run_number }}" \
            --output dist
      - uses: actions/upload-artifact@v4
        if: env.TRIAL_SIGNING_READY == 'true'
        with:
          name: OrchardAtlas-Android-trial
          path: dist/
          retention-days: 14
