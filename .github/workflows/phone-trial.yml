name: Android phone trial
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore optional stable trial signing identity
        env:
          TRIAL_KEYSTORE: ${{ secrets.ANDROID_TRIAL_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          encoded = os.environ.get('TRIAL_KEYSTORE', '')
          if encoded:
              target = pathlib.Path.home() / '.android' / 'debug.keystore'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded, validate=True))
              target.chmod(0o600)
          PY
      - name: Build signed debug APK with local trial data
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo 'Missing repository Actions secret GOOGLE_MAPS_ANDROID_KEY.'
            exit 1
          fi
          flutter build apk --debug --no-pub --dart-define=TRIAL_MODE=true
      - name: Prepare phone download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/OrchardAtlas-trial.apk
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | awk '/SHA1:|SHA256:/ {print}' > dist/SIGNING_CERTIFICATE.txt
          cd dist
          sha256sum OrchardAtlas-trial.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OrchardAtlas-Android-trial
          path: dist/
          retention-days: 14
