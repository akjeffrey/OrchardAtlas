name: Android phone trial
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore stable trial signing identity
        env:
          TRIAL_KEYSTORE: ${{ secrets.ANDROID_TRIAL_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          encoded = os.environ.get('TRIAL_KEYSTORE', '')
          if not encoded:
              print('::warning::Set ANDROID_TRIAL_DEBUG_KEYSTORE_BASE64 to publish an update-safe APK. This run compiles only; no temporary-key APK will be published.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TRIAL_SIGNING_READY=' + ('true' if encoded else 'false') + '\n')
          if encoded:
              target = pathlib.Path.home() / '.android' / 'debug.keystore'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded, validate=True))
              target.chmod(0o600)
          PY
      - name: Build signed debug APK with local trial data
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo 'Missing repository Actions secret GOOGLE_MAPS_ANDROID_KEY.'
            exit 1
          fi
          flutter build apk --debug --no-pub --dart-define=TRIAL_MODE=true --build-name="0.${{ github.run_number }}.0" --build-number="${{ github.run_number }}"
      - name: Prepare phone download
        if: env.TRIAL_SIGNING_READY == 'true'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/OrchardAtlas-trial.apk
          echo 'Version 0.${{ github.run_number }}.0 (${{ github.run_number }})' > dist/VERSION.txt
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | awk '/SHA1:|SHA256:/ {print}' > dist/SIGNING_CERTIFICATE.txt
          cd dist
          sha256sum OrchardAtlas-trial.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: env.TRIAL_SIGNING_READY == 'true'
        with:
          name: OrchardAtlas-Android-trial
          path: dist/
          retention-days: 14
