name: orchard_atlas
description: Offline-first mapping and field records for orchards and gardens.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  google_maps_flutter: ^2.14.0
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  geolocator: ^14.0.2
  uuid: ^4.5.2
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.0.0
  mock_exceptions: ^0.8.2
  google_maps_flutter_platform_interface: ^2.17.0
flutter:
  uses-material-design: true
